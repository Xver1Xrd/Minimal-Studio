name: Android checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Source checks
        run: python3 scripts/verify-source.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.13
      - name: Lint, test and build
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease
      - name: Debug APK for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: minimal-studio-1.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Unsigned release APK (requires your signing key)
        uses: actions/upload-artifact@v4
        with:
          name: minimal-studio-1.1.0-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Publish debug APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0-debug app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Minimal Studio 1.1.0 — debug" \
            --notes "Автоматическая debug-сборка. Перед публикацией пройдены lint и unit-тесты." \
            || gh release upload v1.1.0-debug app/build/outputs/apk/debug/app-debug.apk --clobber
